<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin Login – MBUILD DEVELOPERS</title>
<link rel="icon" type="image/png" href="../assets/images/logo_new.png"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--gold:#c9a84c;--gold-light:#e2c97e;--navy:#0d1f35;--blue:#1a3558;--ease:cubic-bezier(0.16,1,0.3,1);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{height:100%;}
body{font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a1628;position:relative;overflow:hidden;}

/* Background */
.bg-pattern{position:absolute;inset:0;background-image:radial-gradient(rgba(201,168,76,.06) 1px,transparent 1px);background-size:32px 32px;}
.bg-glow{position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(201,168,76,.08) 0%,transparent 65%);top:50%;left:50%;transform:translate(-50%,-50%);}

/* Card */
.login-card{
  position:relative;z-index:1;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.1);
  backdrop-filter:blur(20px);
  border-radius:24px;padding:48px 44px;
  width:100%;max-width:420px;
  box-shadow:0 24px 64px rgba(0,0,0,.4);
  animation:fadeUp .7s ease both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.login-logo{text-align:center;margin-bottom:32px;}
.login-logo-icon{
  width:64px;height:64px;border-radius:18px;
  background:var(--gold);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 14px;font-size:1.6rem;color:var(--navy);font-weight:800;
  box-shadow:0 8px 24px rgba(201,168,76,.4);
}
.login-logo h1{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:800;color:#fff;margin-bottom:4px;}
.login-logo p{font-size:.78rem;color:rgba(255,255,255,.45);letter-spacing:.5px;}
.login-divider{display:flex;align-items:center;gap:10px;margin-bottom:28px;}
.login-divider span{font-size:.72rem;font-weight:700;color:rgba(255,255,255,.3);letter-spacing:2px;text-transform:uppercase;white-space:nowrap;}
.login-divider::before,.login-divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.1);}

/* Form */
.form-group{margin-bottom:18px;}
.form-label{display:block;font-size:.73rem;font-weight:700;color:rgba(255,255,255,.6);letter-spacing:.8px;text-transform:uppercase;margin-bottom:8px;}
.form-input{
  width:100%;padding:13px 16px;
  background:rgba(255,255,255,.06);
  border:1.5px solid rgba(255,255,255,.12);
  border-radius:11px;
  color:#fff;font-size:.9rem;font-family:'DM Sans',sans-serif;
  outline:none;transition:.25s;
}
.form-input::placeholder{color:rgba(255,255,255,.3);}
.form-input:focus{border-color:var(--gold);background:rgba(255,255,255,.09);box-shadow:0 0 0 3px rgba(201,168,76,.15);}
.input-wrap{position:relative;}
.input-wrap .form-input{padding-right:44px;}
.input-wrap .eye-btn{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(255,255,255,.4);cursor:pointer;font-size:.9rem;padding:4px;}
.input-wrap .eye-btn:hover{color:var(--gold);}

/* Submit */
.submit-btn{
  width:100%;padding:14px;
  background:var(--gold);color:var(--navy);
  border:none;border-radius:11px;
  font-size:.92rem;font-weight:800;font-family:'DM Sans',sans-serif;
  letter-spacing:.3px;cursor:pointer;
  transition:.3s var(--ease);
  box-shadow:0 6px 22px rgba(201,168,76,.4);
  display:flex;align-items:center;justify-content:center;gap:9px;
  margin-top:8px;
}
.submit-btn:hover{background:var(--gold-light);transform:translateY(-2px);}
.submit-btn:disabled{opacity:.6;cursor:not-allowed;transform:none;}
.submit-btn .spinner{width:16px;height:16px;border:2.5px solid rgba(13,31,53,.3);border-top-color:var(--navy);border-radius:50%;animation:spin .7s linear infinite;display:none;}
@keyframes spin{to{transform:rotate(360deg)}}

/* Error */
.error-box{display:none;background:rgba(220,38,38,.12);border:1px solid rgba(220,38,38,.3);border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:.83rem;color:#fca5a5;display:flex;align-items:center;gap:8px;}
.error-box.show{display:flex;}

/* Footer */
.login-footer{margin-top:32px;text-align:center;}
.login-footer p{font-size:.76rem;color:rgba(255,255,255,.25);}
.login-footer a{color:rgba(255,255,255,.4);transition:.2s;}
.login-footer a:hover{color:var(--gold);}
.back-site{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:rgba(255,255,255,.35);margin-top:14px;transition:.2s;}
.back-site:hover{color:var(--gold);}
</style>
</head>
<body>
<div class="bg-pattern"></div>
<div class="bg-glow"></div>

<div class="login-card">
  <div class="login-logo">
    <div class="login-logo-icon">M</div>
    <h1>MBUILD Admin</h1>
    <p>Dashboard Control Panel</p>
  </div>

  <div class="login-divider"><span>Sign in to continue</span></div>

  <div class="error-box" id="errorBox">
    <i class="fas fa-circle-exclamation"></i>
    <span id="errorText">Invalid email or password.</span>
  </div>

  <form id="loginForm">
    <div class="form-group">
      <label class="form-label">Admin Email</label>
      <input type="email" id="emailInput" class="form-input" placeholder="admin@mbuilddevelopers.com" required autocomplete="email"/>
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <div class="input-wrap">
        <input type="password" id="passInput" class="form-input" placeholder="Enter your password" required autocomplete="current-password"/>
        <button type="button" class="eye-btn" id="eyeBtn"><i class="fas fa-eye" id="eyeIcon"></i></button>
      </div>
    </div>
    <button type="submit" class="submit-btn" id="submitBtn">
      <span class="spinner" id="spinner"></span>
      <i class="fas fa-right-to-bracket" id="loginIcon"></i>
      <span id="btnText">Sign In to Dashboard</span>
    </button>
  </form>

  <div class="login-footer">
    <p>Secure admin access only. Unauthorized access is prohibited.</p>
    <a href="../index.html" class="back-site"><i class="fas fa-arrow-left"></i> Back to Website</a>
  </div>
</div>

<script src="js/supabase-config.js"></script>
<script>
(async () => {
  // If already logged in, redirect
  const user = await Auth.getUser();
  if (user) window.location.href = 'dashboard.html';
})();

// Toggle password visibility
document.getElementById('eyeBtn').onclick = () => {
  const inp  = document.getElementById('passInput');
  const icon = document.getElementById('eyeIcon');
  inp.type   = inp.type === 'password' ? 'text' : 'password';
  icon.className = inp.type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
};

// Login form
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn     = document.getElementById('submitBtn');
  const spinner = document.getElementById('spinner');
  const icon    = document.getElementById('loginIcon');
  const errBox  = document.getElementById('errorBox');
  const errText = document.getElementById('errorText');
  errBox.classList.remove('show');

  btn.disabled         = true;
  spinner.style.display = 'block';
  icon.style.display   = 'none';
  document.getElementById('btnText').textContent = 'Signing in...';

  try {
    await Auth.login(
      document.getElementById('emailInput').value.trim(),
      document.getElementById('passInput').value
    );
    window.location.href = 'dashboard.html';
  } catch (err) {
    errText.textContent = err.message || 'Invalid email or password.';
    errBox.classList.add('show');
    btn.disabled          = false;
    spinner.style.display = 'none';
    icon.style.display    = 'inline';
    document.getElementById('btnText').textContent = 'Sign In to Dashboard';
  }
});
</script>
</body>
</html>
