<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Settings – MBUILD Admin</title>
<link rel="icon" type="image/png" href="../assets/images/logo_new.png"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap"/>
<link rel="stylesheet" href="css/admin.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.toggle-switch{position:relative;display:inline-block;width:46px;height:24px;}
.toggle-switch input{opacity:0;width:0;height:0;}
.toggle-slider{position:absolute;cursor:pointer;inset:0;background:#cbd5e1;border-radius:24px;transition:.3s;}
.toggle-slider:before{content:'';position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s;}
.toggle-switch input:checked + .toggle-slider{background:var(--success);}
.toggle-switch input:checked + .toggle-slider:before{transform:translateX(22px);}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border);}
.toggle-row:last-child{border-bottom:none;}
.toggle-info h4{font-size:.88rem;font-weight:700;color:var(--text);margin-bottom:2px;}
.toggle-info p{font-size:.76rem;color:var(--text-muted);}
.settings-section{margin-bottom:24px;}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:700px){.settings-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="admin-layout">
  <div class="main-content" id="mainContent">
    <div class="page-body" id="pageBody">
      <div class="loading-spinner"><div class="spinner"></div></div>
    </div>
  </div>
</div>

<script src="js/supabase-config.js"></script>
<script src="js/sidebar.js"></script>
<script>
let settings = {};

(async () => {
  await initAdminPage('settings', 'Settings', 'Configure website and system settings');
  settings = await Settings.getAll();
  renderSettings();
})();

function renderSettings() {
  const s = settings;
  document.getElementById('pageBody').innerHTML = `
    <!-- SEO Settings -->
    <div class="card settings-section">
      <div class="card-header">
        <div class="card-title"><i class="fas fa-globe"></i> SEO & General</div>
        <button class="btn btn-gold" onclick="saveSEO()"><i class="fas fa-save"></i> Save</button>
      </div>
      <div class="card-body">
        <div class="settings-grid">
          <div class="form-group"><label class="form-label">Website Title</label><input class="form-control" id="s-title" value="${esc(s.site_title||'')}"/></div>
          <div class="form-group"><label class="form-label">Site Tagline</label><input class="form-control" id="s-tagline" value="${esc(s.site_tagline||'')}"/></div>
        </div>
        <div class="form-group"><label class="form-label">Meta Description</label><textarea class="form-control" id="s-desc" rows="3">${esc(s.meta_description||'')}</textarea></div>
        <div class="settings-grid">
          <div class="form-group"><label class="form-label">WhatsApp Number</label><input class="form-control" id="s-wa" value="${esc(s.whatsapp_number||'')}" placeholder="918600928493"/><div class="form-hint">Country code + number, no spaces or +</div></div>
          <div class="form-group"><label class="form-label">Map Latitude</label><input class="form-control" id="s-lat" value="${esc(s.google_maps_lat||'')}"/></div>
        </div>
        <div class="form-group"><label class="form-label">Map Longitude</label><input class="form-control" id="s-lng" value="${esc(s.google_maps_lng||'')}"/></div>
      </div>
    </div>

    <!-- EmailJS Settings -->
    <div class="card settings-section">
      <div class="card-header">
        <div class="card-title"><i class="fas fa-envelope"></i> EmailJS Configuration</div>
        <button class="btn btn-gold" onclick="saveEmailJS()"><i class="fas fa-save"></i> Save</button>
      </div>
      <div class="card-body">
        <div style="background:rgba(201,168,76,.08);border:1px solid rgba(201,168,76,.25);border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:.82rem;color:var(--text-muted)">
          <i class="fas fa-info-circle" style="color:var(--gold)"></i> Get these from <a href="https://emailjs.com" target="_blank" style="color:var(--gold);font-weight:700">emailjs.com</a> → Dashboard
        </div>
        <div class="settings-grid">
          <div class="form-group"><label class="form-label">Public Key</label><input class="form-control" id="ejs-pub" value="${esc(s.emailjs_public_key||'')}" placeholder="bAgcwUu..."/></div>
          <div class="form-group"><label class="form-label">Service ID</label><input class="form-control" id="ejs-svc" value="${esc(s.emailjs_service_id||'')}" placeholder="service_..."/></div>
        </div>
        <div class="form-group"><label class="form-label">Template ID</label><input class="form-control" id="ejs-tpl" value="${esc(s.emailjs_template_id||'')}" placeholder="template_..."/></div>
      </div>
    </div>

    <!-- Section Visibility -->
    <div class="card settings-section">
      <div class="card-header">
        <div class="card-title"><i class="fas fa-eye"></i> Section Visibility</div>
        <button class="btn btn-gold" onclick="saveVisibility()"><i class="fas fa-save"></i> Save</button>
      </div>
      <div class="card-body">
        ${[
          ['show_hero',         'Hero Section',         'Full-screen hero with call-to-action'],
          ['show_services',     'Services Section',     'Our most popular services cards'],
          ['show_gallery',      'Photo Gallery',        'Gallery preview on homepage'],
          ['show_projects',     'Civil Projects',       'Featured civil projects section'],
          ['show_testimonials', 'Testimonials',         'Client reviews and feedback'],
          ['show_certificates', 'Certificates',         'Awards and certifications strip'],
        ].map(([key,label,hint]) => `
          <div class="toggle-row">
            <div class="toggle-info">
              <h4>${label}</h4>
              <p>${hint}</p>
            </div>
            <label class="toggle-switch">
              <input type="checkbox" id="t-${key}" ${s[key]==='true'?'checked':''}>
              <span class="toggle-slider"></span>
            </label>
          </div>`).join('')}
      </div>
    </div>

    <!-- Admin Account -->
    <div class="card settings-section">
      <div class="card-header">
        <div class="card-title"><i class="fas fa-user-shield"></i> Admin Account</div>
      </div>
      <div class="card-body">
        <div style="background:#f8fafc;border-radius:10px;padding:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">
          <div>
            <div style="font-size:.88rem;font-weight:700;color:var(--text)" id="adminEmailDisplay">Loading...</div>
            <div style="font-size:.75rem;color:var(--text-muted);margin-top:2px">Current admin email</div>
          </div>
          <button class="btn btn-danger" onclick="Auth.logout()"><i class="fas fa-right-from-bracket"></i> Logout</button>
        </div>
        <div style="margin-top:16px;padding:14px;background:rgba(220,38,38,.06);border:1px solid rgba(220,38,38,.15);border-radius:10px;font-size:.82rem;color:var(--text-muted)">
          <i class="fas fa-shield-halved" style="color:var(--error)"></i> To change your admin password, go to <strong>Supabase Dashboard → Authentication → Users → Reset Password</strong>
        </div>
      </div>
    </div>`;

  Auth.getUser().then(u => {
    if (u) document.getElementById('adminEmailDisplay').textContent = u.email;
  });
}

function esc(str) { return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function v(id) { const el = document.getElementById(id); return el ? el.value : ''; }

async function saveSEO() {
  try {
    await Settings.updateMany({
      site_title: v('s-title'), site_tagline: v('s-tagline'),
      meta_description: v('s-desc'), whatsapp_number: v('s-wa'),
      google_maps_lat: v('s-lat'), google_maps_lng: v('s-lng'),
    });
    toast('SEO settings saved!');
  } catch(e) { toast(e.message, 'error'); }
}

async function saveEmailJS() {
  try {
    await Settings.updateMany({
      emailjs_public_key: v('ejs-pub'),
      emailjs_service_id: v('ejs-svc'),
      emailjs_template_id: v('ejs-tpl'),
    });
    toast('EmailJS settings saved!');
  } catch(e) { toast(e.message, 'error'); }
}

async function saveVisibility() {
  const keys = ['show_hero','show_services','show_gallery','show_projects','show_testimonials','show_certificates'];
  const obj  = {};
  keys.forEach(k => { obj[k] = document.getElementById('t-'+k)?.checked ? 'true' : 'false'; });
  try { await Settings.updateMany(obj); toast('Visibility settings saved!'); }
  catch(e) { toast(e.message, 'error'); }
}
</script>
</body>
</html>
